
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes | CloudNotes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body class="dashboard-page">

    <header class="topbar">
        <a href="{{ url_for('dashboard_page') }}" class="brand dashboard-brand">
            <div class="brand-icon">C</div>
            <span>CloudNotes</span>
        </a>

        <button type="button" id="logoutBtn" class="btn btn-outline">
            Log out
        </button>
    </header>

    <main class="dashboard-container">

        <section class="welcome-section">
            <div>
                <p class="eyebrow">YOUR PERSONAL SPACE</p>
                <h1>Good to see you!</h1>
                <p class="muted">Keep your thoughts organized, one note at a time.</p>
            </div>

            <button type="button" id="newNoteBtn" class="btn btn-primary">
                <span class="plus-icon">+</span> New Note
            </button>
        </section>

        <section class="notes-toolbar">
            <div class="search-box">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search your notes..."
                    aria-label="Search your notes"
                >
            </div>

            <p id="notesCount" class="notes-count">0 notes</p>
        </section>

        <section id="notesGrid" class="notes-grid"
                 aria-label="Your notes">
            <!-- Note cards are generated by script.js -->
        </section>

        <section id="emptyState" class="empty-state" hidden>
            <div class="empty-icon">✎</div>
            <h2 id="emptyTitle">Your space is still empty</h2>
            <p id="emptyDescription" class="muted">
                Create your first note and get your ideas flowing.
            </p>
            <button type="button" id="emptyCreateBtn" class="btn btn-primary">
                Create your first note
            </button>
        </section>

    </main>

    <!-- Create/Edit Note Dialog -->
    <dialog id="noteDialog" class="note-dialog">
        <form id="noteForm" class="note-form">
            <div class="dialog-header">
                <div>
                    <p class="eyebrow">YOUR PERSONAL SPACE</p>
                    <h2 id="dialogTitle">Create a note</h2>
                </div>
                <button type="button" id="closeDialogBtn"
                        class="icon-button" aria-label="Close dialog">
                    &times;
                </button>
            </div>

            <div class="form-group">
                <label for="noteTitle">Note title</label>
                <input
                    type="text"
                    id="noteTitle"
                    name="title"
                    maxlength="120"
                    placeholder="Give your note a title"
                    required
                >
            </div>

            <div class="form-group">
                <label for="noteContent">Content</label>
                <textarea
                    id="noteContent"
                    name="content"
                    rows="7"
                    maxlength="10000"
                    placeholder="Start writing your thoughts..."
                    required
                ></textarea>
            </div>

            <p id="noteMessage" class="form-message"
               role="status" aria-live="polite"></p>

            <div class="dialog-actions">
                <button type="button" id="cancelNoteBtn"
                        class="btn btn-outline">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    Save Note
                </button>
            </div>
        </form>
    </dialog>

    <!-- Confirmation Dialog -->
    <dialog id="deleteDialog" class="note-dialog delete-dialog">
        <div class="delete-content">
            <div class="delete-icon">!</div>
            <h2>Delete this note?</h2>
            <p class="muted">
                This action cannot be undone.
            </p>
            <div class="dialog-actions">
                <button type="button" id="cancelDeleteBtn"
                        class="btn btn-outline">
                    Cancel
                </button>
                <button type="button" id="confirmDeleteBtn"
                        class="btn btn-danger">
                    Delete note
                </button>
            </div>
        </div>
    </dialog>

</body>
</html>
